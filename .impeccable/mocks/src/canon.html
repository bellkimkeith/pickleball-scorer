<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root{--bg:#f2f2f7;--card:#fff;--ink:#111;--mute:#6b6b70;--sep:#e3e3e8;--tint:#1f8a4c}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:390px;height:844px;overflow:hidden}
  body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px 34px;font-weight:600;font-size:16px}
  .nav{display:flex;justify-content:space-between;padding:6px 16px 0;font-size:17px;color:var(--tint)}
  h1{font-size:34px;font-weight:700;padding:4px 16px 0}
  .meta{padding:2px 16px 14px;font-size:15px;color:var(--mute)}
  .seg{margin:0 16px 14px;background:#e4e4ea;border-radius:9px;padding:2px;display:flex}
  .seg div{flex:1;text-align:center;font-size:13px;font-weight:600;padding:6px 0;border-radius:7px;color:#333}
  .seg .on{background:#fff;box-shadow:0 1px 3px #0002}
  .card{background:var(--card);border-radius:14px;margin:0 16px 12px;padding:14px 16px}
  .ch{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:10px}
  .ch b{font-size:17px;color:var(--ink)}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-size:17px;font-weight:600;line-height:1.35}
  .teams .vs{font-size:12px;color:var(--mute);font-weight:600}
  .teams div:last-child{text-align:right}
  .acts{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px}
  .btn.p{background:var(--tint);color:#fff}.btn.s{flex:0 0 90px;background:#eef6f1;color:var(--tint)}
  .hdr{font-size:13px;color:var(--mute);padding:8px 32px 6px;text-transform:uppercase;letter-spacing:.02em}
  .list{background:#fff;border-radius:14px;margin:0 16px}
  .li{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 16px;border-bottom:1px solid var(--sep);font-size:17px}
  .li:last-child{border:0}.li span{color:var(--mute);font-size:15px}
</style></head>
<body>
  <div class="status"><span>7:42</span><span>●●● ▮</span></div>
  <div class="nav"><span>‹ Home</span><span style="font-weight:600">End</span></div>
  <h1>Open Play</h1>
  <div class="meta">12 players · 2 courts · 14 games</div>
  <div class="seg"><div class="on">Courts</div><div>Queue</div><div>Players</div></div>
  <div class="card"><div class="ch"><b>Court 1</b><span>8:14</span></div>
    <div class="teams"><div>Maria<br>Carlo</div><span class="vs">vs</span><div>Bea<br>Jun</div></div>
    <div class="acts"><div class="btn p">Match done</div><div class="btn s">Score</div></div></div>
  <div class="card"><div class="ch"><b>Court 2</b><span>3:02</span></div>
    <div class="teams"><div>Paolo<br>Nikki</div><span class="vs">vs</span><div>Rico<br>Tin</div></div>
    <div class="acts"><div class="btn p">Match done</div><div class="btn s">Score</div></div></div>
  <div class="hdr">Next up</div>
  <div class="list">
    <div class="li">Kat &amp; Migs<span>3 games</span></div>
    <div class="li">Jam &amp; Joy<span>3 · 1 games</span></div>
  </div>
</body></html>
