<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root{
    --outer:#2d5a48; --outer-2:#274f3f; --inner:#2c5c93; --kitchen:#3a6aa3; --line:#f4f6f2;
    --ink:#f4f6f2; --mute:#b9cfc5; --chalk:#e9efe9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:390px;height:844px;overflow:hidden}
  body{font-family:-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--outer);
    background-image:radial-gradient(#ffffff08 1px,transparent 1.2px);background-size:5px 5px}
  .status{height:47px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px 34px;font-weight:600;font-size:16px}
  .nav{display:flex;justify-content:space-between;padding:6px 16px 0;font-size:17px}
  h1{font-size:34px;font-weight:700;padding:4px 16px 0}
  .meta{padding:2px 16px 14px;font-size:15px;color:var(--mute)}
  .courts{display:flex;flex-direction:column;gap:14px;padding:0 12px}
  .court{position:relative;height:124px;background:var(--inner);border-radius:4px;box-shadow:0 0 0 2px var(--line) inset, 0 6px 14px -8px #0008}
  .court:before{content:"";position:absolute;z-index:1;height:auto;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-1px);opacity:.9}
  .k{position:absolute;top:0;bottom:0;width:23%;background:var(--kitchen);box-shadow:2px 0 0 var(--line) inset}
  .k.l{left:27%;box-shadow:inset -2px 0 0 var(--line)} .k.r{right:27%;box-shadow:inset 2px 0 0 var(--line)}
  .k.l{box-shadow:inset 2px 0 0 var(--line)} .k.r{box-shadow:inset -2px 0 0 var(--line)}
  .mid{position:absolute;top:50%;height:2px;background:var(--line);width:27%}
  .mid.l{left:0}.mid.r{right:0}
  .p{position:absolute;font-weight:700;font-size:17px;letter-spacing:.1px;text-shadow:0 1px 2px #0006}
  .p.a{left:12px;top:16px}.p.b{left:12px;bottom:16px}.p.c{right:12px;top:16px}.p.d{right:12px;bottom:16px}
  .badge{position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--line);color:#1d3d31;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;letter-spacing:.04em}
  .clock{position:absolute;z-index:2;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;font-variant-numeric:tabular-nums;background:#0f2a4a;padding:2px 8px;border-radius:6px;color:#dce8f5}
  .acts{display:flex;gap:8px;margin-top:8px}
  .btn{flex:1;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:650;font-size:16px}
  .btn.p1{background:var(--line);color:#1d3d31;font-weight:700}
  .btn.s{flex:0 0 92px;box-shadow:inset 0 0 0 1.5px #ffffff55}
  .rackh{display:flex;justify-content:space-between;align-items:baseline;padding:18px 16px 8px}
  .rackh b{font-size:20px}.rackh span{font-size:13px;color:var(--mute)}
  .rack{position:relative;margin:0 12px;height:196px;background:#1f4134;border-radius:14px;padding:14px 10px 0;display:flex;gap:8px;overflow:hidden;box-shadow:inset 0 2px 6px #0005}
  .rack:after{content:"";position:absolute;left:0;right:0;top:112px;height:10px;background:#16302a;box-shadow:0 1px 0 #ffffff14}
  .pad{position:relative;flex:0 0 62px;z-index:1}
  .face{height:104px;border-radius:26px 26px 18px 18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:12px;font-weight:700;font-size:15px;box-shadow:inset 0 -3px 0 #0002,0 3px 6px -2px #0006}
  .handle{width:20px;height:58px;margin:0 auto;border-radius:0 0 6px 6px;background:repeating-linear-gradient(135deg,#191919 0 4px,#2a2a2a 4px 8px);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:11px;font-weight:800;color:#fff}
  .face small{font-size:10px;font-weight:600;opacity:.75;margin-top:2px}
  .next .face{outline:2px solid var(--line);outline-offset:2px}
  .tape{position:absolute;z-index:2;top:48px;left:40px;width:44px;height:14px;background:#e9d8a6;opacity:.92;transform:rotate(-6deg);border-radius:2px}
  .nextlbl{position:absolute;z-index:2;left:10px;top:0px;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--line);color:#1d3d31;padding:2px 8px;border-radius:0 0 6px 6px}
  .dock{position:absolute;left:0;width:390px;bottom:0;padding:10px 16px 30px}
  .dock div{height:50px;border-radius:14px;background:#10231c;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;box-shadow:inset 0 0 0 1px #ffffff1f}
</style></head>
<body>
  <div class="status"><span>7:42</span><span>●●● ▮</span></div>
  <div class="nav"><span>‹ Home</span><span style="font-weight:600">End session</span></div>
  <h1>Open Play</h1>
  <div class="meta">12 players · 2 courts · 14 games played</div>

  <div class="courts">
    <div>
      <div class="court"><div class="k l"></div><div class="k r"></div><div class="mid l"></div><div class="mid r"></div>
        <span class="badge">COURT 1</span>
        <span class="p a">Maria</span><span class="p b">Carlo</span><span class="p c">Bea</span><span class="p d">Jun</span>
        <span class="clock">08:14</span>
      </div>
      <div class="acts"><div class="btn p1">Match done</div><div class="btn s">Score</div></div>
    </div>
    <div>
      <div class="court" style="margin-top:4px"><div class="k l"></div><div class="k r"></div><div class="mid l"></div><div class="mid r"></div>
        <span class="badge">COURT 2</span>
        <span class="p a">Paolo</span><span class="p b">Nikki</span><span class="p c">Rico</span><span class="p d">Tin</span>
        <span class="clock">03:02</span>
      </div>
      <div class="acts"><div class="btn p1">Match done</div><div class="btn s">Score</div></div>
    </div>
  </div>

  <div class="rackh"><b>Paddle rack</b><span>next four go first · number = games</span></div>
  <div class="rack">
    <span class="nextlbl">NEXT UP</span>
    <div class="pad next"><div class="face" style="background:#e3a33b;color:#2b1d05">Kat</div><div class="handle">3</div></div>
    <div class="pad next"><div class="face" style="background:#e3a33b;color:#2b1d05">Migs</div><div class="handle">3</div></div>
    <span class="tape"></span>
    <div class="pad next"><div class="face" style="background:#f2efe8;color:#1d2a24">Jam</div><div class="handle">3</div></div>
    <div class="pad next"><div class="face" style="background:#e0634a;color:#2a0c05">Joy<small>late</small></div><div class="handle">1</div></div>
    <div class="pad"><div class="face" style="background:#8fc3e6;color:#0d2638">Ana</div><div class="handle">4</div></div>
  </div>

  <div class="dock"><div>＋ Add player</div></div>
</body></html>
